name: Poth Labs
description: >-
  Poth Labs is a Y Combinator (Summer 2026) startup building an AI-native
  customer research platform that positions itself as "the customer brain for
  your company." It aggregates scattered customer feedback from sources such as
  Fireflies, Slack, support tickets, CRM notes, surveys, in-app chat, docs, and
  product analytics into a unified, searchable system, then extracts patterns,
  runs thematic and root-cause analysis, generates hypotheses about user issues
  like churn or checkout abandonment, and validates them through adaptive user
  interviews and targeted follow-up surveys. Founded by Matthew Wong (CEO,
  ex-Palantir, Stanford) and Mojmir Horvath (CTO, ex-Tietoevry) and based
  between San Francisco and New York, the company targets product, growth,
  customer research, and analytics teams. It was added to the API Evangelist
  network as a portfolio lead; as of this enrichment pass Poth Labs publishes a
  marketing site but no public developer, API, or documentation surface.
